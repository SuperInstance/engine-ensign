; platformio.ini — Cummins 6BTA Engine Monitor
; ESP32 + SSD1351 3.5" OLED + analog sensors

[env:cummins_6bta]
platform          = espressif32
board             = esp32dev
framework         = arduino
monitor_speed     = 115200
upload_speed      = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    adafruit/Adafruit SSD1351 library
    adafruit/Adafruit GFX Library
    arduino-libraries/ArduinoJson@^6.21.0

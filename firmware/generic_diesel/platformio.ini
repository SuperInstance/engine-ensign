; platformio.ini — Generic Diesel Engine Monitor
; ESP32 + ILI9341 2.4" LCD + analog sensors

[env:generic_diesel]
platform          = espressif32
board             = esp32dev
framework         = arduino
monitor_speed     = 115200
upload_speed      = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=240
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_MOSI=23
    -DTFT_CLK=18
    -DTFT_MISO=19
    -DTFT_BL=32
    -DTFT_ROTATION=1
    -DSPI_FREQUENCY=40000000

lib_deps =
    TFT_eSPI
    arduino-libraries/ArduinoJson@^6.21.0

; platformio.ini — Yanmar 4LH-STE Engine Monitor
; ESP32 DevKit V1 + ILI9488 7" TFT + NMEA2000 CAN bus
;
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor

[env:yanmar_4lh_ste]
platform          = espressif32
board             = esp32dev
framework         = arduino
monitor_speed     = 115200
upload_speed      = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DUSER_SETUP_LOADED=1
    -DILI9488_DRIVER=1
    -DTFT_WIDTH=480
    -DTFT_HEIGHT=320
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_MOSI=23
    -DTFT_CLK=18
    -DTFT_MISO=19
    -DTFT_BL=32
    -DTFT_ROTATION=1
    -DSPI_FREQUENCY=40000000
    -DSMOOTH_FONT

lib_deps =
    TFT_eSPI
    arduino-libraries/ArduinoJson@^6.21.0

board_build.partitions = default.csv
